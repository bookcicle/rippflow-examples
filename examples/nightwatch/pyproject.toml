[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rippflow-nightwatch"
version = "0.1.0"
description = "Scheduled overnight repository hygiene, disk reclamation, dependency auditing, isolated worktree upgrading, benchmark regression checking, and morning PR digest workflow for Rippflow."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
local-ai = [
  "google-antigravity>=0.1.0",
]
dev = [
  "pytest>=8.0",
  "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
