name: Rippflow Examples CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pr-pipeline:
    name: "examples/pr-pipeline (${{ matrix.os }})"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: examples/pr-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml pytest
      - name: Run cross-platform unit & handler contract tests
        run: pytest -v
